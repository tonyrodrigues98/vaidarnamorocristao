<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4f68" />
    <title>VaiDarNamoro offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Poppins,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 79, 104, 0.16), transparent 32rem), #fff7f8;
        color: #1f1720;
      }

      main {
        width: min(90vw, 420px);
        padding: 32px;
        border: 1px solid rgba(255, 79, 104, 0.18);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(31, 23, 32, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 24px;
        color: #6b5b63;
        line-height: 1.6;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0 22px;
        background: #ff4f68;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(circle at top, rgba(255, 79, 104, 0.22), transparent 32rem), #111113;
          color: #fff7f8;
        }

        main {
          border-color: rgba(255, 255, 255, 0.12);
          background: rgba(24, 24, 27, 0.78);
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        p {
          color: #d8cbd1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexao</h1>
      <p>
        O VaiDarNamoro precisa de internet para carregar perfis, conversas e dados da comunidade.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
