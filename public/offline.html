<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4f68" />
    <title>VaiDarNamoro offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Poppins, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff7f8;
        color: #171719;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0f0f10;
          color: #fafafa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 79, 104, 0.2), transparent 32rem),
          radial-gradient(circle at 80% 20%, rgba(255, 92, 112, 0.16), transparent 28rem),
          currentColor 0 0 / 0 0,
          Canvas;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid rgba(255, 79, 104, 0.22);
        border-radius: 28px;
        padding: 28px;
        background: color-mix(in srgb, Canvas 82%, transparent);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.16);
        backdrop-filter: blur(18px);
      }

      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #ff4f68, #ff7b8c);
        color: #fff;
        font-weight: 900;
        letter-spacing: -0.08em;
      }

      h1 {
        margin: 24px 0 10px;
        font-size: clamp(1.8rem, 7vw, 2.4rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: color-mix(in srgb, currentColor 72%, transparent);
        line-height: 1.7;
      }

      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: #ff4f68;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">VDN</div>
      <h1>Conexao necessaria</h1>
      <p>
        O VaiDarNamoro precisa de internet para carregar perfis, conversas, moedas e dados da sua
        conta. Verifique sua conexao e tente novamente.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
