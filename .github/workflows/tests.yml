name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Integration coverage must use a dedicated, disposable Supabase test project.
  # Never point this job at the published production project.
  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing one of SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / SUPABASE_SERVICE_ROLE_KEY in GitHub Actions secrets."
            exit 1
          fi
      - name: Run RLS / chat / moderation tests
        run: bun run test:supabase

  native-shell-incremental:
    name: Native shell incremental (Supabase excluded)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/integration/native-shell-v1') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve changed-file base
        id: changed-base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] &&
              [ "$before" != "0000000000000000000000000000000000000000" ] &&
              git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "ref=$before" >> "$GITHUB_OUTPUT"
            else
              echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build client and SSR
        run: npm run build
      - name: Lint changed files
        run: npm run lint:changed -- "${{ steps.changed-base.outputs.ref }}"
      - name: Check formatting of changed files
        run: npm run format:check:changed -- "${{ steps.changed-base.outputs.ref }}"
      - name: Run local unit tests
        run: npm run test:unit
      - name: Supabase integration scope
        run: echo "Supabase integration suites are excluded from this job and remain in rls-tests."

  push-dispatch-auth:
    name: Push dispatch auth (no Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test push dispatch authentication
        run: bun run test -- tests/push-dispatch-auth.test.ts
      - name: Build
        run: bun run build
