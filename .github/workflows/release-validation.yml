name: Disposable release validation

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - validation/release-readiness-points-4-9

permissions:
  contents: read

jobs:
  disposable-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Initialize disposable Supabase config
        shell: bash
        run: |
          mv supabase/config.toml "$RUNNER_TEMP/versioned-config.toml"
          mv supabase/migrations "$RUNNER_TEMP/versioned-migrations"
          mkdir supabase/migrations
          supabase init --force >/dev/null
      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/supabase-start.log"
          if ! supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector >"$log" 2>&1; then
            sanitized="$RUNNER_TEMP/supabase-start.sanitized.log"
            sed -E \
              -e 's#(postgres(ql)?://[^:[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
              -e 's#eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+#[REDACTED_JWT]#g' \
              -e 's#(sb_(secret|publishable)_[A-Za-z0-9_-]+)#[REDACTED_KEY]#g' \
              "$log" >"$sanitized"
            diagnostic="$RUNNER_TEMP/supabase-start.diagnostic.log"
            grep -Ei 'error|failed|denied|timeout|deadline|invalid|unhealthy|no space|cannot|not found' "$sanitized" \
              | tail -n 10 >"$diagnostic" || true
            if [[ ! -s "$diagnostic" ]]; then
              tail -n 10 "$sanitized" >"$diagnostic"
            fi
            while IFS= read -r line; do
              printf '::error file=.github/workflows/release-validation.yml,line=1,title=Supabase local start::%s\n' "$line"
            done <"$diagnostic"
            exit 1
          fi
          rm -f "$log"
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/versioned-migrations" supabase/migrations
      - name: Run migrations, RLS, backup and restore rehearsal
        run: bash scripts/release-validation/run-disposable-validation.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-release-validation-${{ github.sha }}
          path: ${{ runner.temp }}/vdn-release-validation
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
